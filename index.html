<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quantum Beats — A New Frequency for 2026's India</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23140a07'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23e0a83e' stroke-width='3'/%3E%3Cpath d='M26 20 L46 32 L26 44 Z' fill='%23e0a83e'/%3E%3C/svg%3E">
<meta name="description" content="Quantum Beats — a new frequency for 2026s India. Live clock, live listener count, and a nonstop playlist, streaming free in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#140a07;
    --bg-alt:#1f120c;
    --gold:#e0a83e;
    --rust:#b1452c;
    --teal:#3f9088;
    --cream:#f4e9d8;
    --cream-dim:#cbb99f9c;
    --line: rgba(244,233,216,0.16);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html, body{
    height:100%;
    overflow:hidden; /* non-scrollable */
  }

  body{
    color:var(--cream);
    font-family:'Poppins', sans-serif;
    font-weight:300;
    line-height:1.5;
  }

  a{color:inherit;}
  .display{font-family:'Yatra One', cursive; font-weight:400;}
  .mono{font-family:'Space Mono', monospace;}

  /* ---------- Background art (original illustration, no external image) ---------- */
  .bg-image{
    position:fixed; inset:0; z-index:-2;
    width:100vw; height:100dvh;
    background-image: url('./quantum-beats-bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .bg-overlay{
    position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(10,6,12,0.10), rgba(10,6,12,0.58) 65%),
      linear-gradient(180deg, rgba(10,6,12,0.30) 0%, rgba(10,6,12,0.80) 100%);
  }

  /* ---------- Barber pole signature ---------- */
  .pole{
    width:9px;
    height:34px;
    background: repeating-linear-gradient(
      -45deg,
      var(--rust) 0 10px,
      var(--cream) 10px 20px,
      var(--teal) 20px 30px
    );
    background-size: 100% 300%;
    animation: pole-spin 3.2s linear infinite;
    border-radius:6px;
    box-shadow:0 0 14px rgba(224,168,62,0.25);
  }
  @keyframes pole-spin{
    from{background-position:0 0;}
    to{background-position:0 300%;}
  }
  @media (prefers-reduced-motion: reduce){ .pole{animation:none;} }

  /* ---------- Hero (the entire page) ---------- */
  .hero-full{
    position:relative;
    width:100vw;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4vh 6vw;
  }

  .content-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:clamp(14px, 2.4vh, 26px);
    max-width:560px;
    width:100%;
  }

  .brand-mark{display:flex; align-items:center; gap:10px;}
  .brand-mark span{font-family:'Yatra One',cursive; font-size:clamp(1.3rem,2.6vw,1.6rem); color:var(--gold);}

  h1.display{
    font-size:clamp(1.9rem, 4.4vw, 2.9rem);
    color:var(--gold);
    line-height:1.2;
    text-shadow: 0 2px 24px rgba(224,168,62,0.2);
  }
  h1.display small{
    display:block;
    font-family:'Poppins',sans-serif;
    font-weight:500;
    font-size:0.4em;
    letter-spacing:0.04em;
    color:var(--cream-dim);
    margin-top:8px;
  }

  /* ---------- LED ticker ---------- */
  .ticker{
    display:inline-flex;
    flex-wrap:wrap;
    justify-content:center;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    background: rgba(13,6,3,0.75);
    box-shadow: inset 0 0 22px rgba(0,0,0,0.6);
  }
  .ticker .cell{
    padding:10px 18px;
    border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:3px;
  }
  .ticker .cell:last-child{border-right:none;}
  .ticker .label{
    font-size:0.6rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--cream-dim);
  }
  .ticker .value{
    font-family:'Space Mono',monospace;
    font-size:1rem;
    color:var(--teal);
    text-shadow:0 0 10px rgba(63,144,136,0.65);
  }
  .ticker .value.gold{color:var(--gold); text-shadow:0 0 10px rgba(224,168,62,0.55);}
  .dot-live{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--rust); margin-right:5px;
    box-shadow:0 0 8px var(--rust);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{50%{opacity:0.25;}}

  /* ---------- Player (compact bar, audio-only — no visible video) ---------- */
  .player-card{
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    background:linear-gradient(160deg, rgba(31,18,12,0.92), rgba(21,12,8,0.92));
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px 18px;
    position:relative;
    overflow:hidden;
    backdrop-filter: blur(6px);
  }

  .album-art{
    width:60px; height:60px; flex:0 0 auto;
    border-radius:12px;
    object-fit:cover;
    background:#0d0603;
    border:1px solid var(--line);
  }

  .track-info{flex:1 1 auto; min-width:0; text-align:left;}
  .track-title{
    font-weight:600; font-size:0.95rem; color:var(--cream);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .track-sub{
    margin-top:2px;
    font-size:0.76rem; color:var(--cream-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .progress-row{
    margin-top:8px;
    display:flex; align-items:center; gap:8px;
  }
  .time{font-family:'Space Mono',monospace; font-size:0.68rem; color:var(--cream-dim); flex:0 0 auto;}
  .progress-bar{
    flex:1 1 auto; height:5px; border-radius:4px;
    background:rgba(244,233,216,0.14);
    cursor:pointer; position:relative;
  }
  .progress-fill{
    height:100%; width:0%; border-radius:4px;
    background: linear-gradient(90deg, var(--rust), var(--gold));
  }

  .controls{
    display:flex; align-items:center; gap:8px; flex:0 0 auto;
  }
  .ctrl-btn{
    width:36px; height:36px; border-radius:50%;
    border:1px solid var(--line);
    background:rgba(244,233,216,0.05);
    color:var(--cream);
    font-size:0.8rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .2s, transform .15s;
  }
  .ctrl-btn:hover{background:rgba(244,233,216,0.12); transform:scale(1.05);}
  #playBtn{
    width:50px; height:50px;
    border:none;
    background: linear-gradient(160deg, #f0b94d, var(--gold));
    color:#140a07;
    font-size:0.95rem;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #playBtn svg{ display:block; }
  #playBtn:hover{transform:scale(1.06);}

  .yt-audio-only{
    position:absolute !important;
    width:1px !important; height:1px !important;
    left:-9999px; top:-9999px;
    overflow:hidden;
  }

  .playlist-link{
    font-size:0.72rem; color:var(--cream-dim);
  }
  .playlist-link a{color:var(--teal); text-decoration:underline;}

  @media (max-width:520px){
    .player-card{flex-wrap:wrap;}
    .controls{order:3; width:100%; justify-content:center; margin-top:4px;}
    .track-info{order:2; width:calc(100% - 76px);}
    .ticker .cell{padding:8px 12px;}
  }

  @media (max-height:640px){
    .content-wrap{gap:10px;}
    h1.display{font-size:clamp(1.5rem,4.6vw,2.2rem);}
  }
</style>
</head>
<body>

<div class="bg-image"></div>
<div class="bg-overlay"></div>

<section class="hero-full">
  <div class="content-wrap">

    <div class="brand-mark">
      <div class="pole"></div>
      <span>Quantum Beats</span>
    </div>

    <h1 class="display">A new frequency for 2026's India</h1>

    <div class="ticker" aria-label="Live salon status">
      <div class="cell">
        <span class="label"><span class="dot-live"></span>Time</span>
        <span class="value gold mono" id="clock">--:--:--</span>
      </div>
      <div class="cell">
        <span class="label">Today</span>
        <span class="value mono" id="dateBox">-- --- ----</span>
      </div>
      <div class="cell">
        <span class="label">Listening now</span>
        <span class="value mono" id="visitorBox">--- online</span>
      </div>
    </div>

    <div class="player-card">
      <img id="albumArt" class="album-art" src="" alt="" />

      <div class="track-info">
        <div class="track-title" id="trackTitle">Quantum Beats</div>
        <div class="track-sub" id="trackSub">Tap play to tune in</div>
        <div class="progress-row">
          <span class="time" id="curTime">0:00</span>
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="time" id="durTime">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="prevBtn" aria-label="Previous track">&#9664;</button>
        <button id="playBtn" aria-label="Play or pause the radio">
          <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4 L20 12 L6 20 Z" fill="currentColor"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" aria-label="Next track">&#9654;</button>
      </div>
    </div>

    <p class="playlist-link">Made with ❤️ in India by Sandeep Mishra</p>

    <!-- Hidden YouTube player: powers audio only, never shown on screen -->
    <div id="ytPlayer" class="yt-audio-only"></div>
  </div>
</section>

<script>
/* ---------------- Live clock & date (Asia/Kolkata) ---------------- */
function updateClock(){
  const now = new Date();
  const timeStr = now.toLocaleTimeString('en-IN', {
    timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
  });
  const dateStr = now.toLocaleDateString('en-IN', {
    timeZone: 'Asia/Kolkata', weekday: 'short', day: '2-digit', month: 'short', year: 'numeric'
  });
  document.getElementById('clock').textContent = timeStr;
  document.getElementById('dateBox').textContent = dateStr;
}
updateClock();
setInterval(updateClock, 1000);

/* ---------------- Simulated live visitor counter ---------------- */
/* Note: this is a client-side simulation, not a real concurrent-session
   count. A true real-time count needs a backend (e.g. a WebSocket server
   or a page-view API) to tally actual visitors across devices. */
let visitors = 780 + Math.floor(Math.random() * 420); // seed between 780-1200
function updateVisitors(){
  const drift = Math.floor(Math.random() * 15) - 6; // -6..+8
  visitors = Math.max(120, visitors + drift);
  document.getElementById('visitorBox').textContent = visitors.toLocaleString('en-IN') + ' online';
}
updateVisitors();
setInterval(updateVisitors, 4000);

/* ---------------- YouTube playlist player (audio only, no video shown) ---------------- */
const PLAYLIST_ID = 'PLRZlMhcYkA2FYuTGWiVTkSz18o2pK8Hv4';
let ytPlayer;
let ytReady = false;
let isPlaying = false;
let progressTimer = null;

const albumArt = document.getElementById('albumArt');
const trackTitle = document.getElementById('trackTitle');
const trackSub = document.getElementById('trackSub');
const curTimeEl = document.getElementById('curTime');
const durTimeEl = document.getElementById('durTime');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const playBtn = document.getElementById('playBtn');

const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady(){
  ytPlayer = new YT.Player('ytPlayer', {
    height: '1',
    width: '1',
    playerVars: {
      listType: 'playlist',
      list: PLAYLIST_ID,
      autoplay: 0,
      rel: 0,
      controls: 0
    },
    events: {
      onReady: onPlayerReady,
      onStateChange: onPlayerStateChange
    }
  });
}

function onPlayerReady(){
  ytReady = true;
  // Cue (but don't play) the first track so its title/thumbnail show immediately in the paused state
  try{
    ytPlayer.cuePlaylist({ listType: 'playlist', list: PLAYLIST_ID, index: 0 });
  }catch(err){}
}

function setPlayIcon(){
  playBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4 L20 12 L6 20 Z" fill="currentColor"/></svg>';
}
function setPauseIcon(){
  playBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="6" height="16" rx="1.5" fill="currentColor"/><rect x="13" y="4" width="6" height="16" rx="1.5" fill="currentColor"/></svg>';
}
function formatTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + s.toString().padStart(2,'0');
}

function updateNowPlaying(){
  try{
    const data = ytPlayer.getVideoData();
    if(data && data.title){
      trackTitle.textContent = data.title;               // song name visible when playing
      trackSub.textContent = (data.author ? data.author + ' · ' : '') + 'Quantum Beats';
      if(data.video_id){
        albumArt.src = 'https://img.youtube.com/vi/' + data.video_id + '/mqdefault.jpg';
      }
    }
  }catch(err){ /* player not ready yet */ }
}

function startProgressTimer(){
  stopProgressTimer();
  progressTimer = setInterval(() => {
    try{
      const cur = ytPlayer.getCurrentTime();
      const dur = ytPlayer.getDuration();
      const remaining = Math.max(0, dur - cur);
      curTimeEl.textContent = formatTime(cur);
      durTimeEl.textContent = '-' + formatTime(remaining);
      progressFill.style.width = (dur > 0 ? (cur / dur) * 100 : 0) + '%';
    }catch(err){}
  }, 500);
}
function stopProgressTimer(){
  if(progressTimer){ clearInterval(progressTimer); progressTimer = null; }
}

function onPlayerStateChange(e){
  if(e.data === YT.PlayerState.PLAYING){
    isPlaying = true;
    setPauseIcon();
    updateNowPlaying();
    startProgressTimer();
  } else if(e.data === YT.PlayerState.PAUSED){
    isPlaying = false;
    setPlayIcon();
    stopProgressTimer();
  } else if(e.data === YT.PlayerState.ENDED){
    isPlaying = false;
    setPlayIcon();
    stopProgressTimer();
  } else if(e.data === YT.PlayerState.CUED){
    updateNowPlaying();
  }
}

playBtn.addEventListener('click', () => {
  if(!ytReady){ return; }
  if(isPlaying){
    ytPlayer.pauseVideo();
  } else {
    ytPlayer.playVideo();
  }
});

document.getElementById('prevBtn').addEventListener('click', () => {
  if(!ytReady){ return; }
  ytPlayer.previousVideo();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if(!ytReady){ return; }
  ytPlayer.nextVideo();
});

progressBar.addEventListener('click', (e) => {
  if(!ytReady){ return; }
  try{
    const rect = progressBar.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    const dur = ytPlayer.getDuration();
    if(dur > 0){
      ytPlayer.seekTo(dur * ratio, true);
    }
  }catch(err){}
});

  // Block Ctrl + U and right Click
  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    alert('Right-click is disabled on this website.');
});
  document.addEventListener('keydown', function (e) {
    // Block Ctrl + U
    if (e.ctrlKey && e.key.toLowerCase() === 'u') {
        e.preventDefault();
    }

    // Block F12
    if (e.key === 'F12') {
        e.preventDefault();
    }

    // Block Ctrl + Shift + I / J / C
    if (
        e.ctrlKey &&
        e.shiftKey &&
        ['i', 'j', 'c'].includes(e.key.toLowerCase())
    ) {
        e.preventDefault();
    }
});
</script>

</body>
</html>
